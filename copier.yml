---
# questions
author_name:
  type: str
  help: "Full name of the Author"
  placeholder: "John Doe"

author_email:
  type: str
  help: "E-mail of the Author"
  placeholder: "jonhdoe@example.com"

github_username:
  type: str
  help: "GitHub Username"

project_name:
  type: str
  help: "Project Name (human readable version)"
  placeholder: "Python Package"

project_slug:
  type: str
  help: "Project slug (used for GitHub repository name, will become python-{project_slug})"
  default: "{{ project_name.lower().replace(' ', '-') }}"

package_name:
  type: str
  help: "The name of the main Python package (used for PyPI and imports, should be a valid Python identifier)"
  placeholder: "{{ project_slug.replace('-', '_') }}"

project_short_description:
  type: str
  help: "A short description of the project"
  placeholder: "A super helpful small Python package."

software_license:
  type: str
  help: Your project's license?
  default: MIT License
  choices:
    - Apache License 2.0
    - Eclipse Public License 2.0
    - GNU General Public License v3.0
    - GNU Lesser General Public License v3.0
    - ISC License
    - MIT License
    - Mozilla Public License 2.0

# Community files inherited from the repository owner's public .github repository.
use_community_defaults:
  type: bool
  help: "Use your account's central community templates and funding instead of local files?"
  default: "{{ github_username == 'klaasnicolaas' }}"

# GitHub Sponsors - question
github_sponsors:
  type: bool
  help: "Use GitHub Sponsors?"
  when: "{{ not use_community_defaults }}"
  default: true

# Ko-fi sponsor - question
kofi_funding:
  type: bool
  help: "Use Ko-fi?"
  when: "{{ not use_community_defaults }}"
  default: true

# Ko-fi username - input
kofi_username:
  type: str
  help: "Ko-fi username"
  when: "{{ not use_community_defaults and kofi_funding }}"

# Bluesky on release - question
bluesky_on_release:
  type: bool
  help: "Post new releases to Bluesky?"
  default: true

# uv sync - question
run_uv_sync:
  type: bool
  help: "Run uv sync after {{ package_name }} generation?"
  default: true

# Initial commit - question
initial_commit:
  type: bool
  help: "Create an initial commit with the generated {{ package_name }}?"
  when: "{{ run_uv_sync == true }}"
  default: false

# Prek (hooks) - question
setup_prek:
  type: bool
  help: "Setup prek hooks using the generated development environment?"
  when: "{{ run_uv_sync == true }}"
  default: false

# =====================================
# | Copier settings for this template |
# =====================================
_min_copier_version: "9.1.0"

# The template root is found here
_subdirectory: template
_templates_suffix: .j2
_message_after_copy: Your package "{{ package_name }}" has been created successfully!
_tasks:
  # Remove local overrides so GitHub can use account community defaults.
  - "{% if use_community_defaults %}rm -rf .github/ISSUE_TEMPLATE .github/PULL_REQUEST_TEMPLATE.md .github/FUNDING.yml{% endif %}"
  # Create the initial lockfile, then optionally sync the environment
  - "uv lock"
  - "{% if run_uv_sync %}uv sync --locked{% endif %}"
  # Initial commit
  - "{% if initial_commit %}git init{% endif %}"
  - "{% if initial_commit %}git add .{% endif %}"
  - "{% if initial_commit %}git commit -m 'project - initial commit'{% endif %}"
  # Setup prek
  - "{% if setup_prek %}git init && uv run prek install{% endif %}"
